# Every setting comes from the environment (Coolify: set them in the app's "Environment Variables" tab;
# `${VAR:?}` = required, `${VAR:-x}` = default x). Locally, from the repo root:
#   docker compose -f docker/docker-compose.yml --env-file .env up -d --build
# No host port is published: Coolify's proxy (or another service on the network) reaches the app on 8080.
name: ktor-app

services:
  ktor-app:
    image: ${KTOR_APP_IMAGE:-ktor-app:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:?MQTT_BROKER_URL is required, e.g. tcp://host:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      # Passenger assistant (/api/v1/assistant/ask) and voice app (/assistant/)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SBB_TWIN_URL: ${SBB_TWIN_URL:-http://127.0.0.1:8787}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      PASSENGER_AGENT_ID: ${PASSENGER_AGENT_ID:-}
      # Push notifications (Web Push needs nothing; Android app: Firebase service account JSON, raw or base64)
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:push@train-twin.invalid}
      # Trip Watch + Wallet passes (docs/WALLET_TRIP_WATCH.md). Off unless WALLET_ENABLED=true; the watch DB defaults to
      # DB_PATH.wallet.sqlite (same volume). Google: issuer class id + service account (file path, or JSON raw/base64).
      # Apple: WALLET_APPLE_P12 / WALLET_APPLE_WWDR_CERT are file paths (mount them, e.g. under /app/data).
      WALLET_ENABLED: ${WALLET_ENABLED:-false}
      WALLET_PUBLIC_BASE_URL: ${WALLET_PUBLIC_BASE_URL:-}
      WALLET_DB_PATH: ${WALLET_DB_PATH:-}
      WALLET_GOOGLE_CLASS_ID: ${WALLET_GOOGLE_CLASS_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      WALLET_APPLE_PASS_TYPE_ID: ${WALLET_APPLE_PASS_TYPE_ID:-}
      WALLET_APPLE_TEAM_ID: ${WALLET_APPLE_TEAM_ID:-}
      WALLET_APPLE_P12: ${WALLET_APPLE_P12:-}
      WALLET_APPLE_P12_PASSWORD: ${WALLET_APPLE_P12_PASSWORD:-}
      WALLET_APPLE_WWDR_CERT: ${WALLET_APPLE_WWDR_CERT:-}
      # Deep links into the mobile app (/.well-known/, mobile/README.md "Deep links"): empty = not served
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      IOS_APP_ID: ${IOS_APP_ID:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      PORT: 8080
      DB_PATH: /app/data/twin.sqlite
    volumes:
      - twin-data:/app/data   # SQLite: incident history + station catalog
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  twin-data:
