# Run from the repo root:   docker compose -f docker/docker-compose.yml up -d --build
# or from this folder:      docker compose up -d --build
# Secrets (MQTT_BROKER_URL, MQTT_USERNAME, MQTT_PASSWORD) come from ../.env (git-ignored, see ../.env.example).
name: ktor-app

services:
  ktor-app:
    image: ${KTOR_APP_IMAGE:-ktor-app:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ktor-app
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: 8080
      DB_PATH: /app/data/twin.sqlite
    volumes:
      - twin-data:/app/data   # SQLite: incident history + station catalog
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  twin-data:
