openapi: 3.0.3
info:
  title: Takt — REST API v1
  version: "1.0"
  description: |
    Read API over the live twin data ingested from MQTT, plus staff incident reports, the passenger assistant and Trip Watch. See docs/API.md.

    - **Times** are epoch milliseconds UTC (Swiss local time = Europe/Zurich). **Delays** are seconds, `+` = late.
    - `trainId` = `{YYYYMMDD}_{GTFS trip_id}`; `stopId` = 7-digit UIC/DIDOK id (e.g. `8503000` Zürich HB, `8507000` Bern).
    - Only **trains already in service** are known. "Now" for windows is the twin clock (last `fleet` tick).
    - `null` fields are always present. Errors: `{"error": {"code", "message"}}`.
    - **Live updates**: WebSocket `ws://<host>/api/v1/ws` (not shown here, OpenAPI can't describe it) — see `docs/API.md`, "WebSocket".
    - **Live fleet** (staff map): WebSocket `ws://<host>/ws/fleet`, every train once per `fleet` tick — see `docs/API.md`, "Live fleet WebSocket".
servers:
  - url: /api/v1
tags:
  - name: status
  - name: trains
  - name: stations
  - name: lines
    description: Lines of the trains in service and their incidents
  - name: incidents
  - name: push
    description: "Push notifications (web + Android app): register a device, follow a train or a line. See docs/API.md, Push notifications"
  - name: reports
    description: Incidents reported by staff through the web UI (stored locally, not published to the twin)
  - name: auth
    description: "Staff login. Click **Authorize** and paste the token from `/auth/login` to call staff-only endpoints. Default user: admin / admin"
  - name: staff
    description: Staff-only calls (Bearer token)
  - name: passenger-app
    description: "Passenger voice app server side (outside /api/v1, errors as {error: message}). See docs/API.md"
  - name: assistant
    description: Passenger assistant (Claude Sonnet 5.5 agent over the live data) for the passenger web app

paths:
  /trip-watches/availability:
    get:
      tags: [trip-watch]
      summary: Check Trip Watch availability
      responses:
        "200":
          description: Feature availability
          content:
            application/json:
              schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
  /trip-watches:
    get:
      tags: [trip-watch]
      summary: List watches owned by this browser
      responses:
        "200":
          description: Active watches
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TripWatch" } }
    post:
      tags: [trip-watch]
      summary: Save a verified passenger selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                journeyId: { type: string }
                trainId: { type: string }
                fromStopId: { type: string }
                toStopId: { type: string }
                onBoard: { type: boolean, default: false }
              oneOf:
                - required: [journeyId]
                - required: [trainId, fromStopId, toStopId]
      responses:
        "201": { $ref: "#/components/responses/TripWatchCreated" }
        "400": { description: Missing or conflicting selection fields }
        "409": { description: The connection has changed or cannot be verified }
  /trip-watches/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Opaque watch link identifier }
    get:
      tags: [trip-watch]
      summary: Get the current instruction
      responses:
        "200": { $ref: "#/components/responses/TripWatchView" }
        "404": { description: Watch unavailable }
    patch:
      tags: [trip-watch]
      summary: Confirm leg progress or wait for a verified departure
      security: [{ tripWatchOwner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { type: string, enum: [boarded, alighted, wait] } } }
      responses:
        "200": { $ref: "#/components/responses/TripWatchView" }
        "400": { description: Invalid action }
        "404": { description: Watch unavailable to this browser }
    delete:
      tags: [trip-watch]
      summary: Stop watching this itinerary
      security: [{ tripWatchOwner: [] }]
      responses:
        "200": { $ref: "#/components/responses/TripWatchView" }
        "404": { description: Watch unavailable to this browser }
  /trip-watches/{id}/apple.pkpass:
    get:
      tags: [trip-watch]
      summary: Download the signed Apple Wallet pass
      security: [{ tripWatchOwner: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Signed pass
          content:
            application/vnd.apple.pkpass:
              schema: { type: string, format: binary }
        "404": { description: Pass unavailable }
  /trip-watches/{id}/google:
    post:
      tags: [trip-watch]
      summary: Create the Google Wallet pass and return its save link
      security: [{ tripWatchOwner: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Signed Add to Google Wallet link
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } }
        "404": { description: Pass unavailable }
        "502": { description: Google Wallet unavailable }
  /status:
    get:
      tags: [status]
      summary: Ingest health + twin heartbeat
      operationId: getStatus
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }

  /trains:
    get:
      tags: [trains]
      summary: List trains (paged, sorted by trainId)
      operationId: listTrains
      parameters:
        - { name: line, in: query, schema: { type: string }, description: "e.g. `IC1`, `S3` (case and spaces ignored: `IC1` = `IC 1`)" }
        - { name: category, in: query, schema: { type: string }, description: "e.g. `IC`, `S`, `RE`" }
        - name: status
          in: query
          description: "`unknown` = position known, info not yet"
          schema: { type: string, enum: [active, cancelled, unknown] }
        - { name: stationId, in: query, schema: { type: string }, description: "Only trains that will still call at / pass through this station", example: "8503000" }
        - { name: atStation, in: query, schema: { type: boolean }, description: "`true` = standing at a station, `false` = on the line" }
        - { name: minDelaySec, in: query, schema: { type: integer }, description: Live delay ≥ this }
        - $ref: "#/components/parameters/bbox"
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 2000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrainSummaryPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /trains/{trainId}:
    get:
      tags: [trains]
      summary: One train — summary, all stops, incidents affecting it
      operationId: getTrain
      parameters: [ { $ref: "#/components/parameters/trainId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrainDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /trains/{trainId}/position:
    get:
      tags: [trains]
      summary: Latest position of a train
      operationId: getTrainPosition
      parameters: [ { $ref: "#/components/parameters/trainId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Position" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /trains/{trainId}/stops:
    get:
      tags: [trains]
      summary: Stops of a train's run
      operationId: getTrainStops
      parameters:
        - $ref: "#/components/parameters/trainId"
        - name: state
          in: query
          description: "`upcoming` = everything not passed"
          schema: { $ref: "#/components/schemas/StopState" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Stop" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /trains/{trainId}/incidents:
    get:
      tags: [trains]
      summary: Active incidents affecting a train (with `match`)
      operationId: getTrainIncidents
      parameters: [ { $ref: "#/components/parameters/trainId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Incident" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /stations:
    get:
      tags: [stations]
      summary: Search stations
      description: The station catalog is restored from SQLite at startup and updated from the feed.
      operationId: listStations
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Station name (case- and accent-insensitive, other-language names and filler words understood), or exact stopId; best match first, ties to the busier station", example: bern }
        - $ref: "#/components/parameters/bbox"
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 5000 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Station" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /stations/{stopId}:
    get:
      tags: [stations]
      summary: Station detail (counts + incidents)
      operationId: getStation
      parameters: [ { $ref: "#/components/parameters/stopId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StationDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /stations/{stopId}/board:
    get:
      tags: [stations]
      summary: Trains that will still call at / pass through the station
      description: Sorted with trains standing at the station first, then by `time`.
      operationId: getStationBoard
      parameters:
        - $ref: "#/components/parameters/stopId"
        - name: type
          in: query
          description: "`departures` excludes trains ending here, `arrivals` excludes trains starting here"
          schema: { $ref: "#/components/schemas/BoardType" }
        - name: windowMin
          in: query
          description: Only entries whose time ≤ now + window (trains standing at the station always included)
          schema: { type: integer, default: 120, minimum: 1, maximum: 1440 }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: includeSkipped, in: query, schema: { type: boolean, default: true }, description: Include trains passing through without stopping }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stations/{stopId}/incidents:
    get:
      tags: [stations]
      summary: Active incidents at a station (with `match`)
      operationId: getStationIncidents
      parameters: [ { $ref: "#/components/parameters/stopId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Incident" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /trains/nearby:
    get:
      tags: [trains]
      summary: Trains near a phone location, best match first
      operationId: getNearbyTrains
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
        - { name: radiusM, in: query, schema: { type: integer, default: 2000 } }
        - { name: headingDeg, in: query, schema: { type: number } }
        - { name: speedKmh, in: query, schema: { type: number } }
        - { name: ts, in: query, description: "fix time, epoch ms", schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "400": { description: Bad parameter }
  /stations/nearby:
    get:
      tags: [stations]
      summary: Stations near a location, nearest first
      operationId: getNearbyStations
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
        - { name: radiusM, in: query, schema: { type: integer, default: 5000 } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "400": { description: Bad parameter }
  /stations/{stopId}/destinations:
    get:
      tags: [stations]
      summary: Stations reachable from here with a train in service
      operationId: getDestinations
      parameters:
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: "Name filter, same matching as /stations?q=" }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        "400": { description: Bad parameter }
  /stations/{stopId}/connections:
    get:
      tags: [stations]
      summary: Trains in service from this station to another
      operationId: getConnections
      parameters:
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: windowMin, in: query, schema: { type: integer, default: 180 } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { description: Bad parameter }
  /routes:
    get:
      tags: [stations]
      summary: Best routes from A to B (planner checked against live data and incidents)
      description: >-
        Candidates from the sbb-twin planner, each leg checked against our live state (expected times, cancellation,
        skipped stops, train already gone) plus our active incidents; changes recomputed. Feasible routes first by
        `effectiveArrival` (expected arrival + risk penalty), the recommended one first. See docs/API.md "Routes".
      operationId: getRoutes
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: Origin stopId or name }
        - { name: to, in: query, required: true, schema: { type: string }, description: Destination stopId or name }
        - { name: after, in: query, schema: { type: integer, format: int64 }, description: Earliest departure, epoch ms }
        - { name: limit, in: query, schema: { type: integer, default: 4, minimum: 1, maximum: 6 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: object }
                  to: { type: object }
                  generatedAt: { type: integer, format: int64 }
                  recommendedId: { type: string, nullable: true }
                  routes:
                    type: array
                    items:
                      type: object
                      properties:
                        journeyId: { type: string }
                        recommended: { type: boolean }
                        departure: { type: integer, format: int64 }
                        arrival: { type: integer, format: int64 }
                        effectiveArrival: { type: integer, format: int64 }
                        durationMin: { type: integer }
                        transfers: { type: integer }
                        feasible: { type: boolean }
                        risk: { type: string, enum: [low, medium, high] }
                        why: { type: string, nullable: true }
                        notes: { type: array, items: { type: string } }
                        legs: { type: array, items: { type: object } }
                        incidents: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: The sbb-twin planner is unavailable }
  /stations/{stopId}/screen:
    get:
      tags: [stations]
      summary: Compact screen view for small displays (next departures + related incidents, ~1 KB)
      description: >-
        Only the fields a departure screen draws. Same data as `topic: screen` on the WebSocket, which pushes it every
        `frequencySec` and immediately on incident changes. Incidents use the station subscription matching (at the
        station itself, or affecting a train that will still call here), worst first, at most 5.
      operationId: getStationScreen
      parameters:
        - { $ref: "#/components/parameters/stopId" }
        - { name: limit, in: query, schema: { type: integer, default: 6, minimum: 1, maximum: 20 }, description: Number of departures }
        - { name: windowMin, in: query, schema: { type: integer, default: 120, minimum: 1, maximum: 1440 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Screen" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /stations/{stopId}/screen.txt:
    get:
      tags: [stations]
      summary: Station screen as plain text for microcontrollers (~250 B)
      description: >-
        Same view as `/stations/{stopId}/screen`, as `text/plain` UTF-8 with one item per line and `|`-separated
        fields: `S|name|HH:MM now|now epoch s`, then `D|HH:MM planned|delay min|line|category|to|cancelled 0/1|atStation 0/1`
        per departure and `I|severity|atStation 0/1|trains|title|where` per incident (worst first). Times are Swiss
        local time, delays whole minutes. The `ETag` covers everything except the clock: send it in `If-None-Match`
        and an unchanged board answers 304 with no body.
      operationId: getStationScreenText
      parameters:
        - { $ref: "#/components/parameters/stopId" }
        - { name: limit, in: query, schema: { type: integer, default: 6, minimum: 1, maximum: 20 }, description: Number of departures }
        - { name: windowMin, in: query, schema: { type: integer, default: 120, minimum: 1, maximum: 1440 } }
        - { name: incidents, in: query, schema: { type: integer, default: 3, minimum: 0, maximum: 5 }, description: Number of incidents }
        - { name: If-None-Match, in: header, schema: { type: string }, description: ETag of the last board received }
      responses:
        "200":
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content:
            text/plain:
              schema: { type: string }
              example: "S|Lausanne|23:27|1795294228\nD|23:34|2|IC1|IC|St. Gallen|0|0\nI|major|1|3|Overhead line fault: Lausanne – Fribourg|Lausanne – Fribourg\n"
        "304": { description: Not modified (same ETag) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /incidents:
    get:
      tags: [incidents]
      summary: List incidents
      operationId: listIncidents
      parameters:
        - { name: all, in: query, schema: { type: boolean, default: false }, description: "`true` = also removed incidents" }
        - { name: severity, in: query, schema: { type: string, enum: [info, minor, major, critical] } }
        - { name: scopeKind, in: query, schema: { type: string, enum: [section, station, train, line, network] } }
        - { name: geometry, in: query, schema: { type: boolean, default: false }, description: "`true` = include each incident's GeoJSON `geometry` (~12 KB each)" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Incident" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /incidents/{id}:
    get:
      tags: [incidents]
      summary: One incident, with GeoJSON geometry
      operationId: getIncident
      parameters: [ { $ref: "#/components/parameters/incidentId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /incidents/{id}/history:
    get:
      tags: [incidents]
      summary: Incident history (oldest first)
      operationId: getIncidentHistory
      parameters: [ { $ref: "#/components/parameters/incidentId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/IncidentEvent" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports:
    get:
      tags: [reports]
      summary: List staff reports (newest first)
      operationId: listReports
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, all], default: open } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Report" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [reports]
      summary: Report an incident (staff only)
      description: "`reporter` defaults to the logged-in staff username."
      security: [ { bearerAuth: [] } ]
      operationId: createReport
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateReport" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/{id}:
    get:
      tags: [reports]
      summary: One staff report
      operationId: getReport
      parameters: [ { $ref: "#/components/parameters/reportId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/{id}/resolve:
    post:
      tags: [reports]
      summary: Mark a report resolved
      operationId: resolveReport
      parameters: [ { $ref: "#/components/parameters/reportId" } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { resolution: { type: string, nullable: true, maxLength: 1000 } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`already_resolved`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in as staff, get a Bearer token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Login" }
            example: { username: admin, password: admin }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LoginResult" } } } }
        "401": { description: "`invalid_credentials`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/me:
    get:
      tags: [auth]
      summary: The logged-in staff user
      operationId: me
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current token
      operationId: logout
      security: [ { bearerAuth: [] } ]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /staff/users:
    get:
      tags: [staff]
      summary: List staff users
      operationId: listUsers
      security: [ { bearerAuth: [] } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [staff]
      summary: Create a staff user
      operationId: createUser
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Login" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "`user_exists`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /staff/users/{username}:
    delete:
      tags: [staff]
      summary: Delete a staff user (and its tokens)
      operationId: deleteUser
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: username, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`cannot_delete_self`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /staff/users/{username}/password:
    put:
      tags: [staff]
      summary: Set a user's password (revokes that user's other sessions)
      operationId: setPassword
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: username, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string, minLength: 4 } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assistant/ask:
    post:
      tags: [assistant]
      summary: Ask the passenger assistant
      description: |
        Agent loop on Claude Sonnet 5.5 over our data and sbb-twin's planner, situation and geometry
        (`docs/API.md`, "Passenger assistant"). Typically 1.5–5 s. Option times come from the planner; map geometry from
        sbb-twin. A failure midway still answers `200` with a short apology.
      operationId: askAssistant
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AskRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AskResponse" } } } }
        "400": { description: "`bad_question` or `bad_request`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`assistant_unavailable` (no ANTHROPIC_API_KEY)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/config:
    get:
      tags: [passenger-app]
      summary: Passenger app config (is voice configured)
      operationId: passengerConfig
      servers: [ { url: / } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/voice/session:
    get:
      tags: [passenger-app]
      summary: One-time ElevenLabs conversation credentials
      operationId: voiceSession
      servers: [ { url: / } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { conversationToken: { type: string, nullable: true }, signedUrl: { type: string, nullable: true } } } } } }
        "502": { description: "ElevenLabs did not answer", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
        "503": { description: "ELEVENLABS_API_KEY or PASSENGER_AGENT_ID not set", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
  /api/brief:
    get:
      tags: [passenger-app]
      summary: Place brief for a station, a route, a line, free text or a position
      operationId: placeBrief
      servers: [ { url: / } ]
      parameters:
        - { name: station, in: query, required: false, schema: { type: string }, description: "stopId or name" }
        - { name: from, in: query, required: false, schema: { type: string }, description: "stopId or name" }
        - { name: to, in: query, required: false, schema: { type: string }, description: "stopId or name" }
        - { name: line, in: query, required: false, schema: { type: string }, description: "e.g. IC5" }
        - { name: q, in: query, required: false, schema: { type: string }, description: "free text (what the passenger said)" }
        - { name: lat, in: query, required: false, schema: { type: string }, description: "latitude" }
        - { name: lon, in: query, required: false, schema: { type: string }, description: "longitude" }
      responses:
        "200": { description: "Brief (sbb-client src/contract.ts)", content: { application/json: { schema: { type: object } } } }
        "404": { description: "No station, route or line recognised", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
  /api/brief/active:
    get:
      tags: [passenger-app]
      summary: Active disruptions for the voice agent
      operationId: activeDisruptions
      servers: [ { url: / } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/brief/item:
    get:
      tags: [passenger-app]
      summary: One disruption in plain words
      operationId: briefItem
      servers: [ { url: / } ]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: "incident, disruption or alert id" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "404": { description: "unknown disruption", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
  /api/fleet:
    get:
      tags: [passenger-app]
      summary: One fleet tick (same rows as /ws/fleet)
      operationId: fleetSnapshot
      servers: [ { url: / } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/nearest:
    get:
      tags: [passenger-app]
      summary: Nearest station
      operationId: nearestStation
      servers: [ { url: / } ]
      parameters:
        - { name: lat, in: query, required: true, schema: { type: string }, description: "latitude" }
        - { name: lon, in: query, required: true, schema: { type: string }, description: "longitude" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
        "400": { description: "lat and lon required", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
        "404": { description: "no station nearby", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
  /twin/{path}:
    get:
      tags: [passenger-app]
      summary: Read-only proxy to sbb-twin (GET/HEAD only)
      operationId: twinProxy
      servers: [ { url: / } ]
      parameters:
        - { name: path, in: path, required: true, schema: { type: string }, description: "twin path, e.g. api/situation" }
      responses:
        "200": { description: "The twin's answer, passed through" }
        "405": { description: "not GET/HEAD", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
        "502": { description: "sbb-twin unreachable", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }

  /lines:
    get:
      tags: [lines]
      summary: Lines of the trains in service
      operationId: listLines
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Filter by line name (spaces and case ignored)", example: "IC 1" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Line" } } } } }
  /lines/{line}:
    get:
      tags: [lines]
      summary: "Line status: trains in service + incidents concerning it"
      operationId: getLine
      parameters:
        - { name: line, in: path, required: true, schema: { type: string }, example: "IC 1" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LineDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /push/config:
    get:
      tags: [push]
      summary: Web Push public key and enabled channels
      operationId: pushConfig
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PushConfig" } } } }
  /push/devices:
    post:
      tags: [push]
      summary: Register a browser (Web Push) or app (FCM token); the same endpoint/token returns the same deviceId
      operationId: registerPushDevice
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterDevice" } } }
      responses:
        "201": { description: Registered, content: { application/json: { schema: { $ref: "#/components/schemas/PushDevice" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { description: "`fcm_disabled`: native push not configured", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /push/devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/deviceId"
    get:
      tags: [push]
      summary: The device
      operationId: getPushDevice
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PushDevice" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [push]
      summary: Unregister the device and its subscriptions
      operationId: deletePushDevice
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /push/devices/{deviceId}/test:
    post:
      tags: [push]
      summary: Send a test notification now
      operationId: testPush
      parameters:
        - $ref: "#/components/parameters/deviceId"
      responses:
        "200":
          description: "`gone` = the push service dropped the device (it is deleted)"
          content: { application/json: { schema: { type: object, properties: { result: { type: string, enum: [ok, gone, failed] } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /push/devices/{deviceId}/subscriptions:
    parameters:
      - $ref: "#/components/parameters/deviceId"
    get:
      tags: [push]
      summary: Trains and lines this device follows
      operationId: listPushSubscriptions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PushSubscription" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [push]
      summary: Follow a train (arrival at stopId + incidents) or a line (incidents only)
      operationId: followForPush
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Follow" } } }
      responses:
        "201": { description: Following, content: { application/json: { schema: { $ref: "#/components/schemas/PushSubscription" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /push/devices/{deviceId}/subscriptions/{subscriptionId}:
    delete:
      tags: [push]
      summary: Stop following
      operationId: unfollowForPush
      parameters:
        - $ref: "#/components/parameters/deviceId"
        - { name: subscriptionId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    tripWatchOwner:
      type: apiKey
      in: cookie
      name: twin_trip_watch
      description: Browser owner cookie set by POST /trip-watches
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from `POST /auth/login`
  parameters:
    trainId:
      { name: trainId, in: path, required: true, schema: { type: string }, example: 20261121_ojp-91-1-D.1.TA.2207.j26 }
    stopId:
      { name: stopId, in: path, required: true, schema: { type: string }, example: "8507000" }
    incidentId:
      { name: id, in: path, required: true, schema: { type: string }, example: i-4d5811f3 }
    deviceId:
      { name: deviceId, in: path, required: true, schema: { type: string }, description: "From POST /push/devices; keep it secret" }
    reportId:
      { name: id, in: path, required: true, schema: { type: string }, example: r-0dfc887a }
    bbox:
      name: bbox
      in: query
      description: "`minLon,minLat,maxLon,maxLat` (WGS84)"
      schema: { type: string }
      example: "8.4,47.3,8.6,47.45"

  responses:
    TripWatchCreated:
      description: Verified watch created and owner cookie set
      content: { application/json: { schema: { $ref: "#/components/schemas/TripWatch" } } }
    TripWatchView:
      description: Current watch and available controls
      content: { application/json: { schema: { $ref: "#/components/schemas/TripWatch" } } }
    Unauthorized:
      description: "`unauthorized`: missing, invalid or expired staff token"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: "Invalid parameter (`bad_<param>`, e.g. `bad_limit`, `bad_bbox`, `bad_type`)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: "`<what>_not_found` (e.g. `train_not_found`, `position_not_found`)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Line:
      type: object
      required: [line, category, trains, incidents]
      properties:
        line: { type: string, example: "IC 1" }
        category: { type: string, nullable: true, example: IC }
        trains: { type: integer, description: Trains in service on the line }
        incidents: { type: integer, description: Active incidents concerning the line }
    LineDetail:
      type: object
      required: [line, category, trains, incidents]
      properties:
        line: { type: string }
        category: { type: string, nullable: true }
        trains: { type: array, items: { $ref: "#/components/schemas/TrainSummary" } }
        incidents: { type: array, items: { $ref: "#/components/schemas/Incident" }, description: "`match`: line | network | train | route | endpoint | station" }
    PushConfig:
      type: object
      required: [webPushPublicKey, fcm, arrivalLeadSec]
      properties:
        webPushPublicKey: { type: string, description: "VAPID public key (base64url) = applicationServerKey" }
        fcm: { type: boolean, description: Native app tokens accepted }
        arrivalLeadSec: { type: integer, example: 120 }
    RegisterDevice:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [web, fcm] }
        endpoint: { type: string, description: "web: PushSubscription.endpoint (https)" }
        keys:
          type: object
          description: "web: PushSubscription keys"
          properties:
            p256dh: { type: string }
            auth: { type: string }
        token: { type: string, description: "fcm: registration token" }
        platform: { type: string, example: android }
    PushDevice:
      type: object
      required: [deviceId, kind, platform, createdAt]
      properties:
        deviceId: { type: string, example: d-3q2aZ1xY0b8 }
        kind: { type: string, enum: [web, fcm] }
        platform: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }
    Follow:
      type: object
      description: Either trainId (+ optional stopId) or line
      properties:
        trainId: { type: string }
        stopId: { type: string, description: "Where you get off: arrival alerts (must still be ahead)" }
        line: { type: string, example: "IC 1" }
    PushSubscription:
      type: object
      required: [id, kind, trainId, line, stopId, stopName, label, alerts, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [train, line] }
        trainId: { type: string, nullable: true }
        line: { type: string, nullable: true }
        stopId: { type: string, nullable: true }
        stopName: { type: string, nullable: true }
        label: { type: string, example: "IC 1 to Genève-Aéroport" }
        alerts: { type: array, items: { type: string, enum: [arrival, incidents] } }
        createdAt: { type: integer, format: int64 }
    TripWatch:
      type: object
      required: [id, origin, destination, instruction, detail, kind, expiresAt, leg, legCount, canManage, actions, apple, google, alternativesUrl, pass]
      properties:
        id: { type: string }
        origin: { type: string }
        destination: { type: string }
        instruction: { type: string }
        detail: { type: string, nullable: true }
        kind: { type: string, enum: [board, alight, wait, check, ended] }
        expiresAt: { type: integer, format: int64 }
        leg: { type: integer, minimum: 1 }
        legCount: { type: integer, minimum: 1 }
        canManage: { type: boolean }
        actions: { type: array, items: { type: string, enum: [boarded, alighted, wait, stop] } }
        apple: { type: boolean }
        google: { type: boolean }
        alternativesUrl: { type: string }
        pass: { $ref: "#/components/schemas/TripWatchPass" }
    TripWatchPass:
      type: object
      description: The face of the Wallet pass (Apple boarding pass and Google generic object), for the page preview. Travel information, not a ticket.
      required: [departure, date, origin, destination, line, changes, nextStep, url, brand, notice]
      properties:
        departure: { type: string, description: "Planned departure of the leg boarded next, dd.MM.yyyy HH:mm Europe/Zurich", example: "22.11.2026 05:53" }
        date: { type: string, example: "22.11.2026" }
        origin: { type: string, example: "Zürich HB" }
        destination: { type: string, example: "Bern" }
        line: { type: string, example: "IR35" }
        changes: { type: string, description: "Direct, 1 change or N changes", example: "Direct" }
        nextStep: { type: string, example: "Take IR35 from Zürich HB at 05:53" }
        url: { type: string, description: "Trip Watch page encoded in the QR code; relative when WALLET_PUBLIC_BASE_URL is unset" }
        brand: { type: string, example: "Takt" }
        notice: { type: string, example: "Travel information · not a ticket" }
    Login:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: admin }
    User:
      type: object
      required: [username, role, createdAt, updatedAt]
      properties:
        username: { type: string }
        role: { type: string, enum: [staff] }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    LoginResult:
      type: object
      required: [token, tokenType, expiresAt, user]
      properties:
        token: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: integer, format: int64 }
        user: { $ref: "#/components/schemas/User" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: train_not_found }
            message: { type: string }

    StopRef:
      type: object
      required: [stopId, name]
      properties:
        stopId: { type: string }
        name: { type: string }

    Position:
      type: object
      required: [lat, lon, bearing, speedKmh, motion, atStopId, continuity, ts]
      properties:
        lat: { type: number }
        lon: { type: number }
        bearing: { type: number, nullable: true }
        speedKmh: { type: number, nullable: true }
        motion: { type: string, nullable: true, enum: [moving, stopped], description: "`stopped` with `atStopId == null` = stopped on the open line" }
        atStopId: { type: string, nullable: true }
        continuity: { type: integer, description: "Changes when the train jumps: don't interpolate across a change" }
        ts: { type: integer, format: int64 }

    StopState:
      type: string
      enum: [passed, current, next, upcoming]

    Stop:
      type: object
      required: [seq, stopId, name, lat, lon, plannedArr, plannedDep, expectedArr, expectedDep, actualArr, actualDep, arrDelaySec, depDelaySec, skipped, state]
      properties:
        seq: { type: integer, description: Index in the run (0 = origin) }
        stopId: { type: string }
        name: { type: string }
        lat: { type: number, nullable: true }
        lon: { type: number, nullable: true }
        plannedArr: { type: integer, format: int64, nullable: true }
        plannedDep: { type: integer, format: int64, nullable: true }
        expectedArr: { type: integer, format: int64, nullable: true }
        expectedDep: { type: integer, format: int64, nullable: true }
        actualArr: { type: integer, format: int64, nullable: true }
        actualDep: { type: integer, format: int64, nullable: true }
        arrDelaySec: { type: integer, nullable: true }
        depDelaySec: { type: integer, nullable: true }
        skipped: { type: boolean, description: The train passes without stopping }
        state: { $ref: "#/components/schemas/StopState" }

    TrainSummary:
      type: object
      required: [trainId, line, category, number, operator, headsign, status, origin, destination, delaySec, position, currentStop, nextStop, infoUpdatedAt]
      properties:
        trainId: { type: string }
        line: { type: string, nullable: true }
        category: { type: string, nullable: true }
        number: { type: string, nullable: true }
        operator: { type: string, nullable: true }
        headsign: { type: string, nullable: true }
        status: { type: string, enum: [active, cancelled, unknown] }
        origin: { allOf: [ { $ref: "#/components/schemas/StopRef" } ], nullable: true }
        destination: { allOf: [ { $ref: "#/components/schemas/StopRef" } ], nullable: true }
        delaySec: { type: integer, nullable: true, description: Live delay at the next stop }
        position: { allOf: [ { $ref: "#/components/schemas/Position" } ], nullable: true }
        currentStop: { allOf: [ { $ref: "#/components/schemas/StopRef" } ], nullable: true, description: Station the train is standing at }
        nextStop: { allOf: [ { $ref: "#/components/schemas/Stop" } ], nullable: true, description: Null at terminus }
        infoUpdatedAt: { type: integer, format: int64, nullable: true }

    TrainSummaryPage:
      type: object
      required: [total, limit, offset, items]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/TrainSummary" } }

    TrainDetail:
      type: object
      required: [train, stops, incidents]
      properties:
        train: { $ref: "#/components/schemas/TrainSummary" }
        stops: { type: array, items: { $ref: "#/components/schemas/Stop" } }
        incidents: { type: array, items: { $ref: "#/components/schemas/Incident" } }

    Station:
      type: object
      required: [stopId, name, lat, lon]
      properties:
        stopId: { type: string, example: "8507000" }
        name: { type: string, example: Bern }
        lat: { type: number, nullable: true }
        lon: { type: number, nullable: true }

    StationDetail:
      type: object
      required: [station, trainsPresent, trainsUpcoming, incidents]
      properties:
        station: { $ref: "#/components/schemas/Station" }
        trainsPresent: { type: integer, description: Trains standing at the station now }
        trainsUpcoming: { type: integer, description: Trains in service that will still call at / pass through }
        incidents: { type: array, items: { $ref: "#/components/schemas/Incident" } }

    BoardType:
      type: string
      enum: [departures, arrivals, all]
      default: departures

    BoardEntry:
      type: object
      required: [trainId, line, category, number, operator, headsign, status, origin, destination, stop, time, plannedTime, delaySec, atStation, startsHere, terminatesHere, incidents]
      properties:
        trainId: { type: string }
        line: { type: string, nullable: true }
        category: { type: string, nullable: true }
        number: { type: string, nullable: true }
        operator: { type: string, nullable: true }
        headsign: { type: string, nullable: true }
        status: { type: string }
        origin: { allOf: [ { $ref: "#/components/schemas/StopRef" } ], nullable: true }
        destination: { allOf: [ { $ref: "#/components/schemas/StopRef" } ], nullable: true }
        stop: { $ref: "#/components/schemas/Stop" }
        time: { type: integer, format: int64, nullable: true, description: Expected (else planned) dep/arr depending on type; sort key }
        plannedTime: { type: integer, format: int64, nullable: true }
        delaySec: { type: integer, nullable: true }
        atStation: { type: boolean }
        startsHere: { type: boolean }
        terminatesHere: { type: boolean }
        incidents: { type: array, items: { $ref: "#/components/schemas/Incident" }, description: "Active incidents concerning this train (with `match`), worst first" }

    Board:
      type: object
      required: [station, type, now, windowMin, entries]
      properties:
        station: { $ref: "#/components/schemas/Station" }
        type: { $ref: "#/components/schemas/BoardType" }
        now: { type: integer, format: int64, description: Twin clock used for the window }
        windowMin: { type: integer }
        entries: { type: array, items: { $ref: "#/components/schemas/BoardEntry" } }

    Screen:
      type: object
      required: [stopId, name, now, departures, incidents]
      properties:
        stopId: { type: string }
        name: { type: string }
        now: { type: integer, format: int64, description: Twin clock (epoch ms) }
        departures:
          type: array
          items:
            type: object
            required: [plannedTime, delaySec, line, category, to, cancelled, atStation]
            properties:
              plannedTime: { type: integer, format: int64, nullable: true, description: Planned departure (epoch ms) }
              delaySec: { type: integer, description: Live delay in seconds (0 if unknown) }
              line: { type: string, description: "Line, else the category" }
              category: { type: string, nullable: true }
              to: { type: string, description: "Destination, else the headsign" }
              cancelled: { type: boolean }
              atStation: { type: boolean }
        incidents:
          type: array
          items:
            type: object
            required: [id, severity, title, where, atStation, trains, updatedAt]
            properties:
              id: { type: string }
              severity: { type: string, nullable: true, enum: [info, minor, major, critical] }
              title: { type: string }
              where: { type: string, nullable: true }
              atStation: { type: boolean, description: "true = at the station itself; false = only via its trains" }
              trains: { type: integer, description: Upcoming trains at the station affected }
              updatedAt: { type: integer, format: int64 }
    IncidentScope:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [section, station, train, line, network] }
        from: { type: string, nullable: true }
        to: { type: string, nullable: true }
        stopId: { type: string, nullable: true }
        trainId: { type: string, nullable: true }
        line: { type: string, nullable: true }

    Incident:
      type: object
      required: [id, title, description, severity, type, reasonCode, scope, where, disruptionId, status, active, createdAt, updatedAt, firstSeenAt, removedAt, match, geometry]
      properties:
        id: { type: string, example: i-4d5811f3 }
        title: { type: string }
        description: { type: string }
        severity: { type: string, nullable: true, enum: [info, minor, major, critical] }
        type: { type: string, nullable: true, example: overhead_line_fault }
        reasonCode: { type: string, nullable: true }
        scope: { allOf: [ { $ref: "#/components/schemas/IncidentScope" } ], nullable: true }
        where: { type: string, nullable: true }
        disruptionId: { type: string, nullable: true }
        status: { type: string }
        active: { type: boolean }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        firstSeenAt: { type: integer, format: int64 }
        removedAt: { type: integer, format: int64, nullable: true }
        match:
          type: string
          nullable: true
          enum: [train, route, endpoint, station, line, network]
          description: Why it is listed for a train/station; null in plain lists
        geometry:
          type: object
          nullable: true
          description: GeoJSON (MultiLineString), only on `GET /incidents/{id}` and `GET /incidents?geometry=true`

    IncidentEvent:
      type: object
      required: [seq, kind, receivedAt, updatedAt, status, severity]
      properties:
        seq: { type: integer, format: int64 }
        kind: { type: string, enum: [created, updated, removed, missing], description: "`missing` = unmarked while we were offline" }
        receivedAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64, nullable: true }
        status: { type: string, nullable: true }
        severity: { type: string, nullable: true }

    TwinStatus:
      type: object
      required: [streamId, ts, tick, trainsActive, trainsSimulated, timetableDate, online]
      properties:
        streamId: { type: string }
        ts: { type: integer, format: int64 }
        tick: { type: integer, format: int64 }
        trainsActive: { type: integer }
        trainsSimulated: { type: integer }
        timetableDate: { type: string, nullable: true }
        online: { type: boolean, description: false when no heartbeat for > 30 s }

    Status:
      type: object
      required: [now, mqttConnected, trains, positions, stations, lastFleetTs, twin]
      properties:
        now: { type: integer, format: int64 }
        mqttConnected: { type: boolean }
        trains: { type: integer }
        positions: { type: integer }
        stations: { type: integer }
        lastFleetTs: { type: integer, format: int64, nullable: true }
        twin: { allOf: [ { $ref: "#/components/schemas/TwinStatus" } ], nullable: true }

    CreateReport:
      type: object
      required: [title, scope]
      properties:
        title: { type: string, maxLength: 200, example: Door fault on coach 5 }
        description: { type: string, maxLength: 4000, default: "" }
        category: { type: string, enum: [rolling_stock, infrastructure, signalling, station, person, obstacle, weather, other], default: other }
        severity: { type: string, enum: [info, minor, major, critical], default: minor }
        scope: { type: string, enum: [station, section, train, point], description: "station: stopId; section: stopId + toStopId; train: trainId; point: lat + lon" }
        stopId: { type: string, nullable: true, example: "8507000" }
        toStopId: { type: string, nullable: true }
        trainId: { type: string, nullable: true }
        lat: { type: number, nullable: true, description: "Required for point; optional for train (default: its live position)" }
        lon: { type: number, nullable: true }
        reporter: { type: string, nullable: true, maxLength: 100 }

    Report:
      type: object
      required: [id, title, description, category, severity, scope, stopId, toStopId, trainId, line, where, lat, lon, reporter, status, createdAt, updatedAt, resolvedAt, resolution]
      properties:
        id: { type: string, example: r-0dfc887a }
        title: { type: string }
        description: { type: string }
        category: { type: string, enum: [rolling_stock, infrastructure, signalling, station, person, obstacle, weather, other] }
        severity: { type: string, enum: [info, minor, major, critical] }
        scope: { type: string, enum: [station, section, train, point] }
        stopId: { type: string, nullable: true }
        toStopId: { type: string, nullable: true }
        trainId: { type: string, nullable: true }
        line: { type: string, nullable: true, description: Line of the train at report time }
        where: { type: string, example: "IC1 737 → Zürich HB" }
        lat: { type: number, nullable: true, description: "Station, section midpoint, train position at report time, or the point" }
        lon: { type: number, nullable: true }
        reporter: { type: string, nullable: true }
        status: { type: string, enum: [open, resolved] }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        resolvedAt: { type: integer, format: int64, nullable: true }
        resolution: { type: string, nullable: true }

    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 2000, example: "My IC to Bern was cancelled, how do I get there?" }
        context:
          type: object
          nullable: true
          description: What the app knows; stopIds (station names also work), all optional
          properties:
            fromStopId: { type: string, nullable: true, example: "8503000" }
            toStopId: { type: string, nullable: true, example: "8507000" }
            trainId: { type: string, nullable: true, description: The train the passenger is on }
            lat: { type: number, nullable: true }
            lon: { type: number, nullable: true }
            onScreen:
              type: object
              nullable: true
              description: >-
                What the passenger has open in the passenger view behind the assistant (sent by /assistant/ when it is
                embedded there). "This train", "this line" or "here" refer to it; it is not necessarily their own trip.
                With no destination given, a `connections` screen is planned as the trip.
              properties:
                screen: { type: string, enum: [train, line, station, destinations, connections] }
                label: { type: string, nullable: true, example: "IC 1 to Genève-Aéroport" }
                trainId: { type: string, nullable: true }
                line: { type: string, nullable: true, example: "IC1" }
                stopId: { type: string, nullable: true, description: "station / destinations screens" }
                fromStopId: { type: string, nullable: true, description: "connections screen, or the trip of a train screen" }
                toStopId: { type: string, nullable: true }
        history:
          type: array
          description: Last turns of the conversation, oldest first
          items:
            type: object
            properties:
              role: { type: string, enum: [passenger, assistant] }
              text: { type: string }
        sessionId: { type: string, nullable: true }

    AskResponse:
      type: object
      required: [answer, summary, situation, options, visuals, followUp, elapsedMs]
      properties:
        answer: { type: string, description: "Spoken reply for the voice agent: 1-3 short sentences, no markdown" }
        summary: { type: string, nullable: true, description: Short line for the screen }
        situation: { type: array, items: { $ref: "#/components/schemas/SituationItem" } }
        options: { type: array, description: "Recommended journey first, at most one alternative", items: { $ref: "#/components/schemas/AskOption" } }
        visuals: { type: array, description: "Map commands; empty = leave the map as it is, else starts with `clear`", items: { $ref: "#/components/schemas/VisualCommand" } }
        followUp: { type: string, nullable: true, description: Optional question for the passenger }
        elapsedMs: { type: integer, format: int64 }
        unavailable:
          type: array
          description: Out-of-scope topics the passenger asked about (no data); passed as is to the voice agent
          items: { type: string, enum: [platforms, accessibility, fares, tickets, refunds, occupancy, luggage, bikes, bus_stop_location, local_transport] }
        append: { type: boolean, nullable: true, description: "true = add the visuals to the current map picture; otherwise they replace it" }

    SituationItem:
      type: object
      required: [id, title, where, severity, source]
      properties:
        id: { type: string }
        title: { type: string }
        where: { type: string, nullable: true }
        severity: { type: string, enum: [info, minor, major, critical] }
        source: { type: string, enum: [staff, auto, sbb], description: "staff = marked or reported by staff, auto = detected from train movements, sbb = SBB notice" }

    AskOption:
      type: object
      required: [id, label, departure, arrival, transfers, recommended, why, journeyId]
      properties:
        id: { type: string, example: A }
        label: { type: string, example: "IC 8 at 18:42, direct" }
        departure: { type: integer, format: int64, nullable: true, description: "Expected departure (planner, epoch ms)" }
        arrival: { type: integer, format: int64, nullable: true }
        transfers: { type: integer, nullable: true }
        recommended: { type: boolean }
        why: { type: string, nullable: true }
        journeyId: { type: string, nullable: true, description: "sbb-twin journey id (`/geometry/journey/{id}`)" }

    GeoJson:
      type: object
      description: GeoJSON LineString or MultiLineString (WGS84)
      additionalProperties: true

    VisualCommand:
      type: object
      required: [type]
      description: |
        One map command, by `type`:
        `clear` · `focus {bbox: [w, s, e, n]}` · `route {id, style: recommended|alternative, label, legs: [{line, trainId, fromName, toName, geometry}]}` ·
        `section {id, colour: red|orange|green|blue, label, geometry}` · `train {trainId, label, follow}` ·
        `station {stopId, name, lon, lat, role: origin|destination|transfer|incident, label}` · `timer {label, until}`
      properties:
        type: { type: string, enum: [clear, focus, route, section, train, station, timer] }
        bbox: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        id: { type: string }
        style: { type: string, enum: [recommended, alternative] }
        label: { type: string, nullable: true }
        legs:
          type: array
          items:
            type: object
            properties:
              line: { type: string, nullable: true }
              trainId: { type: string, nullable: true }
              fromName: { type: string, nullable: true }
              toName: { type: string, nullable: true }
              geometry: { allOf: [ { $ref: "#/components/schemas/GeoJson" } ], nullable: true }
        colour: { type: string, enum: [red, orange, green, blue] }
        geometry: { allOf: [ { $ref: "#/components/schemas/GeoJson" } ], nullable: true }
        trainId: { type: string }
        follow: { type: boolean }
        stopId: { type: string }
        name: { type: string }
        lon: { type: number, nullable: true }
        lat: { type: number, nullable: true }
        role: { type: string, enum: [origin, destination, transfer, incident] }
        until: { type: integer, format: int64 }
