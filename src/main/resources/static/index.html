<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Train twin · Your trip</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23eb0000%22/%3E%3Cpath d=%22M7 3h2v4h4v2H9v4H7V9H3V7h4z%22 fill=%22%23fff%22/%3E%3C/svg%3E" />
    <script>
      // Same theme as the staff pages (docs/STYLE.md): saved choice, else the system preference. Before first paint.
      document.documentElement.dataset.theme = localStorage.getItem("twin-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="preload" href="https://cdn.app.sbb.ch/fonts/v1_6_subset/SBBWeb-Roman.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://cdn.app.sbb.ch/fonts/v1_6_subset/SBBWeb-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js" defer></script>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/passenger.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="m9 15-1-1"/><path d="m15 15 1-1"/><path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/><path d="m8 19-2 3"/><path d="m16 19 2 3"/></svg></span>
        Train twin
      </div>
      <span class="live" id="live">Live</span>
      <span class="spacer"></span>
      <button class="btn" id="restart" type="button" hidden>Change trip</button>
      <button class="icon-btn" id="theme" type="button" title="Dark mode" aria-label="Dark mode"></button>
    </header>

    <div id="passenger-app">
      <nav class="watched-trips-nav" aria-label="Saved journeys" hidden>
        <a href="/trip-watch.html">Watched trips</a>
      </nav>
      <main id="stage" aria-live="polite"></main>
    </div>

    <noscript><p style="padding: 16px">This page needs JavaScript.</p></noscript>
    <!-- Travel assistant (voice + chat, /assistant/): floating button, opens the chat in a panel over the page -->
    <div class="assistant-panel" id="assistant-panel" role="dialog" aria-label="Travel assistant" hidden></div>
    <button class="assistant-fab" id="assistant-fab" type="button" title="Travel assistant" aria-label="Open the travel assistant" aria-expanded="false" aria-controls="assistant-panel">
      <svg class="icon open" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
      <svg class="icon close" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <script src="/assistant-launcher.js" defer></script>
    <script type="module" src="/passenger.js"></script>
  </body>
</html>
