<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n>Takt · Your trip</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/i18n.js"></script>
    <script src="/i18n-strings.js"></script>
    <script src="/theme-init.js"></script>
    <!-- Installable web app (needed for alerts on iPhone: Share > Add to Home Screen) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#eb0000" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Takt" />
    <link rel="preload" href="https://cdn.app.sbb.ch/fonts/v1_6_subset/SBBWeb-Roman.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://cdn.app.sbb.ch/fonts/v1_6_subset/SBBWeb-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js" defer></script>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/passenger.css" />
    <link rel="stylesheet" href="/tikt.css" />
    <link rel="stylesheet" href="/onboarding.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="/favicon.svg" width="28" height="28" alt="" />
        Takt
      </div>
      <span class="live" id="live" data-i18n>Live</span>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-circle icon-btn" id="alerts-btn" type="button" title="Your alerts" aria-label="Your alerts" data-i18n-title data-i18n-aria-label></button>
      <button class="btn btn-ghost btn-circle icon-btn" id="tour-btn" type="button" title="Show the tour" aria-label="Show the tour" data-i18n-title data-i18n-aria-label></button>
      <span data-lang-picker class="select select-ghost select-sm lang-select"></span>
      <button class="btn btn-ghost btn-circle icon-btn" id="theme" type="button" title="Dark mode" aria-label="Dark mode"></button>
    </header>

    <div id="passenger-app">
      <nav class="trip-nav" aria-label="Journey tools" data-i18n-aria-label>
        <button class="btn btn-ghost btn-sm" id="restart" type="button" hidden data-i18n>Change trip</button>
        <a class="watched-trips-link" href="/trip-watch.html" hidden data-i18n>Watched trips</a>
      </nav>
      <main id="stage" aria-live="polite"></main>
    </div>

    <noscript><p style="padding: 16px">This page needs JavaScript.</p></noscript>
    <!-- Travel assistant (voice + chat, /assistant/): floating button, opens the chat in a panel over the page -->
    <div class="assistant-panel" id="assistant-panel" role="dialog" aria-label="Travel assistant" data-i18n-aria-label tabindex="-1" hidden></div>
    <button class="btn btn-circle assistant-fab" id="assistant-fab" type="button" title="Travel assistant" aria-label="Open the travel assistant" data-i18n-title data-i18n-aria-label aria-expanded="false" aria-controls="assistant-panel">
      <svg class="icon open" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
      <svg class="icon close" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <script src="/assistant-launcher.js" defer></script>
    <script src="/app-links.js" defer></script>
    <script type="module" src="/passenger/main.js"></script>
  </body>
</html>
