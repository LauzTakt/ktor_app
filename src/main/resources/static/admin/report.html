<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Train twin · Report an incident</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // apply the saved (or system) theme before the first paint
      document.documentElement.dataset.theme = localStorage.getItem("twin-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="stylesheet" href="/style.css" />
    <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
  </head>
  <body class="report-page">
    <header class="topbar">
      <div class="brand"><span class="logo">+</span> Train twin <span class="sub">Report an incident</span></div>
      <nav><button class="btn" id="themeToggle" type="button">☾ Dark</button> <a class="btn" href="/admin/">← Back to the map</a></nav>
    </header>
    <main class="report-main">
      <form id="form" class="card" autocomplete="off">
        <h2>New report</h2>

        <label>What happened? <span class="req">*</span>
          <input name="title" required maxlength="200" placeholder="e.g. Door fault on coach 5, train cannot leave" />
        </label>

        <div class="grid2">
          <label>Category
            <select name="category" id="category"></select>
          </label>
          <label>Severity
            <select name="severity">
              <option value="info">Info: no impact on traffic</option>
              <option value="minor" selected>Minor: small delays</option>
              <option value="major">Major: serious delays</option>
              <option value="critical">Critical: line blocked or danger</option>
            </select>
          </label>
        </div>

        <fieldset>
          <legend>Where?</legend>
          <div class="seg" id="scopeSeg">
            <label><input type="radio" name="scope" value="station" checked /> Station</label>
            <label><input type="radio" name="scope" value="section" /> Between two stations</label>
            <label><input type="radio" name="scope" value="train" /> On a train</label>
            <label><input type="radio" name="scope" value="point" /> Point on the map</label>
          </div>

          <div data-scope="station section">
            <label><span data-scope="station">Station</span><span data-scope="section">From station</span>
              <input id="stationA" list="stationsA" placeholder="type a station name, e.g. Bern" />
              <datalist id="stationsA"></datalist>
            </label>
          </div>
          <div data-scope="section">
            <label>To station
              <input id="stationB" list="stationsB" placeholder="type a station name, e.g. Thun" />
              <datalist id="stationsB"></datalist>
            </label>
          </div>
          <div data-scope="train">
            <label>Train (line, number or destination)
              <input id="trainSearch" list="trainsList" placeholder="e.g. IC 1, 712, Genève-Aéroport" />
              <datalist id="trainsList"></datalist>
            </label>
          </div>
          <div data-scope="point" class="muted">Click on the map to place the incident.</div>
          <div id="pickMap"></div>
          <div id="whereText" class="where muted"></div>
        </fieldset>

        <label>Details
          <textarea name="description" rows="4" maxlength="4000" placeholder="What do you see? Is anyone hurt? Is the track blocked?"></textarea>
        </label>
        <label>Your name / team (optional)
          <input name="reporter" maxlength="100" placeholder="e.g. Train driver, RE 3456" />
        </label>

        <div class="actions">
          <button class="btn primary" type="submit">Send report</button>
          <span id="msg"></span>
        </div>
      </form>

      <section class="card">
        <h2>Reports</h2>
        <div class="seg small" id="filterSeg">
          <label><input type="radio" name="filter" value="open" checked /> Open</label>
          <label><input type="radio" name="filter" value="resolved" /> Resolved</label>
          <label><input type="radio" name="filter" value="all" /> All</label>
        </div>
        <ul id="reports" class="list reports"></ul>
      </section>
    </main>
    <script type="module" src="/report.js"></script>
  </body>
</html>
