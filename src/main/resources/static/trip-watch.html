<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Trip Watch · Train twin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/passenger.css" />
    <link rel="stylesheet" href="/trip-watch.css" />
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("twin-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <script src="/trip-watch.js" type="module"></script>
    <script src="/app-links.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="watch-brand" href="/">Train twin</a>
      <span class="spacer"></span>
      <a class="watch-nav" href="/trip-watch.html">Watched trips</a>
    </header>
    <main id="passenger-app" class="watch-page">
      <div class="watch-layout" id="watch-page-content" aria-busy="true">
        <h1>Trip Watch</h1>
        <p class="lead">Loading your trip…</p>
      </div>
      <p class="watch-feedback" id="watch-feedback" role="status"></p>
    </main>
  </body>
</html>
