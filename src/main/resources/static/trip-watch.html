<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Trip Watch · Takt</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/passenger.css" />
    <link rel="stylesheet" href="/trip-watch.css" />
    <script src="/i18n.js"></script>
    <script src="/i18n-strings.js"></script>
    <script src="/theme-init.js"></script>
    <script src="/trip-watch.js" type="module"></script>
    <script src="/app-links.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="watch-brand" href="/"><img src="/favicon.svg" width="28" height="28" alt="" />Takt</a>
      <span class="spacer"></span>
      <span data-lang-picker class="select select-ghost select-sm lang-select"></span>
      <a class="watch-nav" href="/trip-watch.html" data-i18n>Watched trips</a>
    </header>
    <main id="passenger-app" class="watch-page">
      <div class="watch-layout" id="watch-page-content" aria-busy="true">
        <h1 data-i18n>Trip Watch</h1>
        <p class="lead" data-i18n>Loading your trip…</p>
      </div>
      <p class="watch-feedback" id="watch-feedback" role="status"></p>
    </main>
  </body>
</html>
