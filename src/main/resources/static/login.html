<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Train twin · Staff login</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("twin-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="login-page">
    <header class="topbar">
      <div class="brand"><img src="/favicon.svg" width="28" height="28" alt="" /> Train twin</div>
      <div class="stats"></div>
      <nav><button class="btn" id="themeToggle" type="button">☾ Dark</button></nav>
    </header>
    <main class="login-main">
      <form id="form">
        <h1>Staff login</h1>
        <label>Username <input class="input" name="username" required autocomplete="username" autofocus /></label>
        <label>Password <input class="input" name="password" type="password" required autocomplete="current-password" /></label>
        <button class="btn btn-primary" type="submit">Log in</button>
        <span id="msg" role="status"></span>
      </form>
    </main>
    <script type="module">
      import { initTheme } from "/common.js";
      initTheme();
      // Only same-site paths ("/x", not "//host" or "https://..."): no open redirect.
      const raw = new URLSearchParams(location.search).get("next") || "/admin/";
      const next = raw.startsWith("/") && !raw.startsWith("//") ? raw : "/admin/";
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "";
        const r = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ username: form.elements.username.value, password: form.elements.password.value }),
        });
        if (r.ok) location.href = next; // the session cookie is set by the response
        else msg.textContent = r.status === 401 ? " Wrong username or password." : ` Login failed (HTTP ${r.status}).`;
      });
    </script>
  </body>
</html>
