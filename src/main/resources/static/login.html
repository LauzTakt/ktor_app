<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Takt · Staff login</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/i18n.js"></script>
    <script src="/i18n-strings.js"></script>
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="login-page">
    <header class="topbar">
      <div class="brand"><img src="/favicon.svg" width="28" height="28" alt="" /> Takt</div>
      <div class="stats"></div>
      <nav><span data-lang-picker class="select select-ghost select-sm lang-select"></span> <button class="btn" id="themeToggle" type="button">☾ Dark</button></nav>
    </header>
    <main class="login-main">
      <form id="form">
        <h1 data-i18n>Staff login</h1>
        <label><span data-i18n>Username</span> <input class="input" name="username" required autocomplete="username" autofocus /></label>
        <label><span data-i18n>Password</span> <input class="input" name="password" type="password" required autocomplete="current-password" /></label>
        <button class="btn btn-primary" type="submit" data-i18n>Log in</button>
        <span id="msg" role="status"></span>
      </form>
    </main>
    <script type="module">
      import { initTheme, t } from "/common.js";
      initTheme();
      document.title = t("Takt · Staff login");
      // Only same-site paths ("/x", not "//host" or "https://..."): no open redirect.
      const raw = new URLSearchParams(location.search).get("next") || "/admin/";
      const next = raw.startsWith("/") && !raw.startsWith("//") ? raw : "/admin/";
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "";
        const r = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ username: form.elements.username.value, password: form.elements.password.value }),
        });
        if (r.ok) location.href = next; // the session cookie is set by the response
        else msg.textContent = " " + (r.status === 401 ? t("Wrong username or password.") : t("Login failed (HTTP {status}).", { status: r.status }));
      });
    </script>
  </body>
</html>
