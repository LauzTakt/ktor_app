ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - ch.lauzhack.twin.ApplicationKt.module

# sbb-twin broker (see docs/DATA_SOURCE.md). Credentials come from env / .env (never commit them).
mqtt:
  enabled: "$MQTT_ENABLED:true"
  brokerUrl: "$MQTT_BROKER_URL:tcp://127.0.0.1:1883"
  username: "$MQTT_USERNAME:"
  password: "$MQTT_PASSWORD:"
  clientIdPrefix: "ktor-app"

# Staff accounts (auth/Auth.kt). `admin` is created with this password only when there are no users yet.
auth:
  adminPassword: "$ADMIN_PASSWORD:admin"
  tokenTtlHours: "$AUTH_TOKEN_TTL_HOURS:12"

db:
  path: "$DB_PATH:data/twin.sqlite"

# Passenger assistant (POST /api/v1/assistant/ask, docs/API.md). The Claude API key is read from ANTHROPIC_API_KEY
# (env only, never in this file); without it the endpoint answers 503.
assistant:
  twinUrl: "$SBB_TWIN_URL:http://127.0.0.1:8787"
  model: "$ASSISTANT_MODEL:claude-sonnet-5-5"
  fastMode: "$ASSISTANT_FAST_MODE:false"
  effort: "$ASSISTANT_EFFORT:low"
  maxModelCalls: "$ASSISTANT_MAX_MODEL_CALLS:6"

# Passenger voice app (sbb-client port, passenger/): ElevenLabs agent for /api/voice/session. The ElevenLabs API key is
# read from ELEVENLABS_API_KEY (env only, never in this file); without key + agent id the endpoint answers 503.
# sbb-twin is reached at assistant.twinUrl (SBB_TWIN_URL).
passenger:
  agentId: "$PASSENGER_AGENT_ID:"
  elevenLabsUrl: "$ELEVENLABS_API_URL:https://api.elevenlabs.io"
