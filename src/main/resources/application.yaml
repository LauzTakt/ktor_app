ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - ch.lauzhack.twin.ApplicationKt.module

# sbb-twin broker (see docs/DATA_SOURCE.md). Credentials come from env / .env (never commit them).
mqtt:
  enabled: "$MQTT_ENABLED:true"
  brokerUrl: "$MQTT_BROKER_URL:tcp://127.0.0.1:1883"
  username: "$MQTT_USERNAME:"
  password: "$MQTT_PASSWORD:"
  clientIdPrefix: "ktor-app"

db:
  path: "$DB_PATH:data/twin.sqlite"

# Passenger assistant (POST /api/v1/assistant/ask, docs/API.md). The Claude API key is read from ANTHROPIC_API_KEY
# (env only, never in this file); without it the endpoint answers 503.
assistant:
  twinUrl: "$SBB_TWIN_URL:http://127.0.0.1:8787"
  model: "$ASSISTANT_MODEL:claude-opus-5-5"
  fastMode: "$ASSISTANT_FAST_MODE:true"
  effort: "$ASSISTANT_EFFORT:low"
  maxModelCalls: "$ASSISTANT_MAX_MODEL_CALLS:6"
