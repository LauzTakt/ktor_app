<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Talk to a calm travel assistant about your train: what happened, and the best way to your destination, on a live map." />
    <title>Travel assistant</title>
    <script>
      // Theme before the first paint (rules in src/theme.ts): the parent page's when embedded, else the saved choice, else the system's.
      (() => {
        let t = null;
        try { if (parent !== window) t = parent.document.documentElement.dataset.theme; } catch {}
        try { t = t || localStorage.getItem("twin-theme"); } catch {}
        t = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#17191c");
      })();
    </script>
    <!-- shared fonts + light / dark palette, served by ktor_app (src/main/resources/static/theme.css) -->
    <link rel="stylesheet" href="/theme.css" vite-ignore />
    <!-- Loki, the mascot who speaks for the assistant (src/main/resources/static/loki.css) -->
    <link rel="stylesheet" href="/loki.css" vite-ignore />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.app.sbb.ch" crossorigin />
    <link rel="preconnect" href="https://vectortiles.geo.admin.ch" crossorigin />
    <link rel="preload" href="https://cdn.app.sbb.ch/fonts/v1_6_subset/SBBWeb-Roman.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://cdn.app.sbb.ch/fonts/v1_6_subset/SBBWeb-Bold.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
